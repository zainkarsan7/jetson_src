octomap_resolution: 0.003

sensors:
  - collision_depth

collision_depth:
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  image_topic: /collision/depth/image_raw
  queue_size: 1
  near_clipping_plane_distance: 0.30
  far_clipping_plane_distance: 0.5
  shadow_threshold: 0.20
  padding_scale: 1.0
  padding_offset: 0.01
  max_update_rate: 1.0
  skip_vertical_pixels: 1
  skip_horizontal_pixels: 1
  
