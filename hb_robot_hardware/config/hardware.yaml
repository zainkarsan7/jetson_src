platform_bridge:
  ros__parameters:
    port: /dev/ttyACM0  # Replace with this board's persistent device path.
    baud: 230400
    flap_open_deg: 45
    flap_closed_deg: 5

torch_height_bridge:
  ros__parameters:
    port: /dev/ttyACM1  # Replace with this board's persistent device path.
    baud: 230400
    calibration_mode: false
    steps_per_mm: 40.0
    positive_direction_high: true
    prep_distance_mm: 10.0
    search_distance_mm: 15.0
    home_max_travel_mm: 27.0
    voltage_tracking_enabled: false